# Configuración del deploy de demostración en AWS (SDD 0009): una VM con
# `docker compose` (este servidor, Postgres y Caddy) en
# services/serverpod/deploy/aws/. Caddy termina el HTTPS y pasa todo al 8080:
# ningún otro puerto sale de la VM.
#
# Los valores que dependen de la máquina vienen del entorno, no de este
# archivo:
#   SERVERPOD_API_SERVER_PUBLIC_HOST  api.<ip>.sslip.io (las URLs de archivos)
#   SERVERPOD_PASSWORD_<clave>        cada secreto (database, serviceSecret…)
# Ver services/serverpod/deploy/aws/.env.example.

# El servidor de la API. El host público lo pone el entorno: es el que usan
# las URLs de fotos y avatares que arma el almacenamiento.
apiServer:
  port: 8080
  publicHost: api.nexo.invalid
  publicPort: 443
  publicScheme: https

# Insights corre adentro de la VM y no se publica: Caddy no lo enruta.
insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

# Postgres es el servicio `postgres` del mismo compose, en la red interna de
# Docker: sin SSL porque el tráfico nunca sale de la VM.
database:
  host: postgres
  port: 5432
  name: nexo
  user: postgres
  requireSsl: false
  maxConnectionCount: 10

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

# Los logs van a la consola (`docker compose logs server`), en texto. Sin
# persistirlos en la base: en una VM de 1 GB, una tabla de logs que crece en
# cada request es memoria y disco que le falta a Postgres.
sessionLogs:
  persistentEnabled: false
  consoleEnabled: true
  consoleLogFormat: text

# Recordatorio, expiración y replay automático de los shows (SDD 0008).
futureCall:
  enabled: true
  executionEnabled: true
  concurrencyLimit: 1
  scanInterval: 5000
