### Códigos de error de negocio que el cliente puede mapear a un Failure.
enum: NexoErrorCode
values:
  - unauthenticated
  - forbidden
  - notFound
  - conflict
  - invalidInput
  - rateLimited
  ### Iniciar o programar un vivo sin ser creador verificado.
  - creatorNotVerified
  ### La cuenta está suspendida o baneada: no puede escribir.
  - accountSuspended
  ### La cuenta está silenciada: no puede comentar ni chatear.
  - muted
